server {
    listen 80;
    listen [::]:80;
    server_name tempfile.xyz www.tempfile.xyz;

    root /var/www/tempfile.xyz;
    index index.html;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/tempfile.xyz;
    }

    # SPA fallback - all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/tempfile.xyz.access.log;
    error_log /var/log/nginx/tempfile.xyz.error.log;
}
