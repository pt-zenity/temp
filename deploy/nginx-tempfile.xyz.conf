server {
    server_name tempfile.xyz www.tempfile.xyz;

    root /var/www/tempfile.xyz;
    index index.html;

    client_max_body_size 53687091200;  # 50 GiB - see server/.env MAX_FILE_SIZE_BYTES

    # ── Security headers (applied to every response from this vhost) ───────
    # HSTS: force HTTPS for this host (and subdomains) for a year, and allow
    # browser preload lists to pin it - safe here since the site is only
    # ever served over HTTPS (HTTP is a hard 301 redirect below).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    # Stop browsers from MIME-sniffing responses into a different, more
    # dangerous content type than the one we declared.
    add_header X-Content-Type-Options "nosniff" always;
    # Disallow this site being framed by any other origin (clickjacking
    # protection) - nothing here is meant to be embedded in an <iframe>.
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    # Don't leak the full referring URL (which could contain a file id) to
    # third-party sites when a user clicks an outbound link.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # This app uses none of these browser features - explicitly deny them.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/tempfile.xyz;
    }

    # Self-hosted backend API (upload, metadata, health)
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Generous timeouts + streamed (unbuffered) request body - both
        # needed to support uploads up to MAX_FILE_SIZE_BYTES (50 GiB by
        # default). Without proxy_request_buffering off, nginx would first
        # write the entire request body to its own temp file on disk
        # before forwarding it upstream, doubling disk I/O and delaying the
        # start of the S3 multipart upload until the whole file has
        # finished uploading to nginx.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }

    # File view (inline) - streamed from S3 through the backend
    location /f/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long-running download of a large file - don't let nginx give up
        # partway through a multi-gigabyte transfer.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # File download (attachment) - streamed from S3 through the backend
    location /dl/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback - all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/tempfile.xyz.access.log;
    error_log /var/log/nginx/tempfile.xyz.error.log;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tempfile.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tempfile.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}
server {
    if ($host = www.tempfile.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = tempfile.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name tempfile.xyz www.tempfile.xyz;
    return 404; # managed by Certbot
}
